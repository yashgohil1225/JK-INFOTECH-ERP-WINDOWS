services:
  postgres:
    image: postgres:15
    container_name: jk_erp_postgres
    restart: always
    environment:
      POSTGRES_DB: jk_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jkerp_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jk_erp_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: