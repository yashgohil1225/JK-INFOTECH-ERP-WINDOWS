<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GST Summary Report</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 15mm 10mm;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1e293b;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .header {
      margin-bottom: 25px;
      border-bottom: 2px solid #111827;
      padding-bottom: 15px;
    }
    .company-title {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 5px 0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .company-details {
      color: #475569;
      font-size: 11px;
      line-height: 1.4;
    }
    .report-badge {
      float: right;
      text-align: right;
    }
    .badge-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 5px 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-period {
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      text-transform: uppercase;
    }
    .clear {
      clear: both;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .report-table th {
      background-color: #f1f5f9;
      color: #111827;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 10px 12px;
      border-bottom: 2px solid #cbd5e1;
      text-align: left;
    }
    .report-table td {
      padding: 10px 12px;
      font-size: 11px;
      border-bottom: 1px solid #e2e8f0;
    }
    .text-right {
      text-align: right;
    }
    .grand-total {
      background-color: #f1f5f9;
      color: #111827;
      font-weight: bold;
    }
    .grand-total td {
      border-top: 2px solid #cbd5e1;
      border-bottom: 2px solid #cbd5e1;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="report-badge">
      <h2 class="badge-title">GST Summary</h2>
      <div id="badge-period" class="badge-period"></div>
    </div>
    <h1 id="company-title" class="company-title"></h1>
    <div id="company-details" class="company-details"></div>
    <div class="clear"></div>
  </div>

  <table class="report-table">
    <thead>
      <tr>
        <th style="width: 60%;">Particulars</th>
        <th class="text-right" style="width: 40%;">Amount</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Data injected dynamically -->
    </tbody>
  </table>

  <script>
    const rawData = '{{ report_data_json | safe }}';
    const reportData = JSON.parse(rawData);

    document.getElementById('company-title').textContent = reportData.companyInfo.name;
    let detailsHTML = '';
    if (reportData.companyInfo.address) detailsHTML += `Address: ${reportData.companyInfo.address}<br>`;
    if (reportData.companyInfo.gst_number) detailsHTML += `GSTIN: ${reportData.companyInfo.gst_number} | `;
    if (reportData.companyInfo.contact) detailsHTML += `Phone: ${reportData.companyInfo.contact} | `;
    if (reportData.companyInfo.email) detailsHTML += `Email: ${reportData.companyInfo.email}`;
    document.getElementById('company-details').innerHTML = detailsHTML;

    document.getElementById('badge-period').textContent = `Generated On: ${reportData.generated_on}`;

    const fmt = (val) => "₹" + Number(val).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const tbody = document.getElementById('table-body');
    const rows = [
      { label: "Total Sales Value (Outward)", val: reportData.total_sales_value },
      { label: "Output Tax (GST Collected)", val: reportData.output_tax },
      { label: "Total Purchase Value (Inward)", val: reportData.total_purchases_value },
      { label: "ITC Claimed (GST Paid)", val: reportData.itc_claimed }
    ];

    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.label}</td>
        <td class="text-right">${fmt(r.val)}</td>
      `;
      tbody.appendChild(tr);
    });

    const netTr = document.createElement('tr');
    netTr.className = "grand-total";
    netTr.innerHTML = `
      <td><strong>Net GST Payable / (Refundable)</strong></td>
      <td class="text-right"><strong>${fmt(reportData.net_tax_payable)}</strong></td>
    `;
    tbody.appendChild(netTr);
  </script>
</body>
</html>
