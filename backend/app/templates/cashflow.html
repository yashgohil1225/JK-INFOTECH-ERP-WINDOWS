<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cash Flow Statement</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 15mm 10mm;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      color: #1e293b;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid #111827;
      padding-bottom: 12px;
    }
    .company-title {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }
    .company-details {
      color: #475569;
      font-size: 11px;
      line-height: 1.4;
    }
    .report-badge {
      float: right;
      text-align: right;
    }
    .badge-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 4px 0;
    }
    .badge-period {
      font-size: 10px;
      font-weight: bold;
      color: #475569;
    }
    .clear {
      clear: both;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #111827;
      margin: 15px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 4px;
    }
    .table-container {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background-color: #f8fafc;
      font-weight: bold;
      padding: 8px 12px;
      border-bottom: 1px solid #cbd5e1;
      font-size: 10.5px;
      color: #475569;
      text-transform: uppercase;
      text-align: left;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .text-right {
      text-align: right;
    }
    .font-bold {
      font-weight: bold;
    }
    .indent-1 {
      padding-left: 24px;
    }
    .indent-2 {
      padding-left: 48px;
      color: #475569;
    }
    .amount-col {
      width: 25%;
      font-weight: 600;
      text-align: right;
    }
    .net-col {
      width: 25%;
      font-weight: bold;
      text-align: right;
    }
    .total-row {
      border-top: 1.5px solid #111827 !important;
      border-bottom: 1.5px double #111827 !important;
      font-weight: bold;
      background-color: #fafafa;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="report-badge">
      <h2 class="badge-title">CASH FLOW STATEMENT</h2>
      <div id="badge-period" class="badge-period"></div>
    </div>
    <h1 id="company-title" class="company-title"></h1>
    <div id="company-details" class="company-details"></div>
    <div class="clear"></div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Particulars</th>
          <th class="text-right" style="width: 25%;">Amount</th>
          <th class="text-right" style="width: 25%;">Net Cash Flow</th>
        </tr>
      </thead>
      <tbody id="cashflow-body">
        <!-- Dynamically rendered via JS -->
      </tbody>
    </table>
  </div>

  <script>
    const rawData = '{{ db_data_json | safe }}';
    const raw = JSON.parse(rawData);
    const reportData = raw.data || raw;

    // Set company details
    document.getElementById('company-title').textContent = reportData.companyInfo.name;
    let detailsHTML = '';
    if (reportData.companyInfo.address) detailsHTML += `Address: ${reportData.companyInfo.address}<br>`;
    const gstStr = reportData.companyInfo.gst_number ? `GSTIN: ${reportData.companyInfo.gst_number}` : '';
    const panStr = reportData.companyInfo.pan_number ? `PAN: ${reportData.companyInfo.pan_number}` : (reportData.companyInfo.gst_number && reportData.companyInfo.gst_number.length >= 12 ? `PAN: ${reportData.companyInfo.gst_number.substring(2, 12)}` : '');
    const gstPanCombined = [gstStr, panStr].filter(Boolean).join(' | ');
    if (gstPanCombined) detailsHTML += `${gstPanCombined}<br>`;
    if (reportData.companyInfo.contact) detailsHTML += `Phone: ${reportData.companyInfo.contact} | `;
    if (reportData.companyInfo.email) detailsHTML += `Email: ${reportData.companyInfo.email}`;
    document.getElementById('company-details').innerHTML = detailsHTML;

    // Set period
    document.getElementById('badge-period').textContent = `Period: ${reportData.period.startDate} to ${reportData.period.endDate}`;

    function fmt(val, showSign = false) {
      if (val === undefined || val === null || isNaN(val)) return '₹0.00';
      const num = Number(val);
      const absFormatted = '₹' + Math.abs(num).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (showSign) {
        return num < 0 ? `(${absFormatted})` : absFormatted;
      }
      return num < 0 ? `(${absFormatted})` : absFormatted;
    }

    const tbody = document.getElementById('cashflow-body');

    // 1. Operating Activities
    const op = reportData.operating;
    tbody.innerHTML += `<tr class="font-bold text-slate-800"><td>A. Cash Flows from Operating Activities</td><td></td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-1">Net Profit for the Period</td><td class="amount-col">${fmt(op.netProfit)}</td><td></td></tr>`;

    // Adjustments
    tbody.innerHTML += `<tr class="font-bold"><td class="indent-1">Adjustments for:</td><td></td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Depreciation</td><td class="amount-col">${fmt(op.depreciation)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Finance Costs</td><td class="amount-col">${fmt(op.financeCosts)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Interest Received</td><td class="amount-col">${fmt(op.interestReceived ? -op.interestReceived : 0)}</td><td></td></tr>`;

    tbody.innerHTML += `<tr class="font-bold"><td class="indent-1">Operating Profit before Working Capital Changes</td><td class="amount-col">${fmt(op.operatingProfitBeforeWC)}</td><td></td></tr>`;

    // Working Capital Changes
    tbody.innerHTML += `<tr class="font-bold"><td class="indent-1">Working Capital Changes:</td><td></td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Decrease (Increase) in Inventories</td><td class="amount-col">${fmt(op.wcChanges.inventory)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Decrease (Increase) in Receivables & Debtors</td><td class="amount-col">${fmt(op.wcChanges.receivables)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Decrease (Increase) in Loans & Advances</td><td class="amount-col">${fmt(op.wcChanges.advances)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Decrease (Increase) in Other Current Assets</td><td class="amount-col">${fmt(op.wcChanges.other_assets)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Increase (Decrease) in Payables & Creditors</td><td class="amount-col">${fmt(op.wcChanges.payables)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Increase (Decrease) in Borrowings (Short-term)</td><td class="amount-col">${fmt(op.wcChanges.borrowings_short)}</td><td></td></tr>`;
    tbody.innerHTML += `<tr><td class="indent-2">Increase (Decrease) in Other Current Liabilities</td><td class="amount-col">${fmt(op.wcChanges.other_liabilities)}</td><td></td></tr>`;

    tbody.innerHTML += `<tr class="font-bold text-emerald-600"><td class="indent-1">Net Cash Flow from Operating Activities (A)</td><td></td><td class="net-col">${fmt(op.netCash)}</td></tr>`;


    // 2. Investing Activities
    const inv = reportData.investing;
    tbody.innerHTML += `<tr class="font-bold text-slate-800"><td>B. Cash Flows from Investing Activities</td><td></td><td></td></tr>`;
    
    if (inv.items && inv.items.length > 0) {
      inv.items.forEach(item => {
        tbody.innerHTML += `<tr><td class="indent-1">${item.name}</td><td class="amount-col">${fmt(item.amount)}</td><td></td></tr>`;
      });
    } else {
      tbody.innerHTML += `<tr><td class="indent-1 text-muted">No investing transactions recorded</td><td></td><td></td></tr>`;
    }
    tbody.innerHTML += `<tr class="font-bold text-emerald-600"><td class="indent-1">Net Cash Flow from Investing Activities (B)</td><td></td><td class="net-col">${fmt(inv.netCash)}</td></tr>`;


    // 3. Financing Activities
    const fin = reportData.financing;
    tbody.innerHTML += `<tr class="font-bold text-slate-800"><td>C. Cash Flows from Financing Activities</td><td></td><td></td></tr>`;
    
    if (fin.items && fin.items.length > 0) {
      fin.items.forEach(item => {
        tbody.innerHTML += `<tr><td class="indent-1">${item.name}</td><td class="amount-col">${fmt(item.amount)}</td><td></td></tr>`;
      });
    } else {
      tbody.innerHTML += `<tr><td class="indent-1 text-muted">No financing transactions recorded</td><td></td><td></td></tr>`;
    }
    tbody.innerHTML += `<tr class="font-bold text-emerald-600"><td class="indent-1">Net Cash Flow from Financing Activities (C)</td><td></td><td class="net-col">${fmt(fin.netCash)}</td></tr>`;


    // 4. Reconciliation
    tbody.innerHTML += `<tr class="total-row"><td class="font-bold">Net Increase (Decrease) in Cash (A + B + C)</td><td></td><td class="net-col">${fmt(reportData.netIncrease)}</td></tr>`;
    tbody.innerHTML += `<tr><td class="font-bold indent-1">Cash and Equivalents at Beginning of Period</td><td></td><td class="net-col font-bold" style="color: #475569;">${fmt(reportData.openingCash)}</td></tr>`;
    tbody.innerHTML += `<tr class="total-row"><td class="font-bold indent-1" style="color: #0f2537;">Cash and Equivalents at End of Period</td><td></td><td class="net-col text-slate-900">${fmt(reportData.closingCash)}</td></tr>`;
  </script>
</body>
</html>
