<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Balance Sheet</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 15mm 10mm;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      color: #1e293b;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid #111827;
      padding-bottom: 12px;
    }
    .company-title {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }
    .company-details {
      color: #475569;
      font-size: 11px;
      line-height: 1.4;
    }
    .report-badge {
      float: right;
      text-align: right;
    }
    .badge-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 4px 0;
    }
    .badge-period {
      font-size: 10px;
      font-weight: bold;
      color: #475569;
    }
    .clear {
      clear: both;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #111827;
      margin: 15px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 4px;
    }
    .ledger-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .ledger-side {
      padding: 0;
    }
    .ledger-side:first-child {
      border-right: 1px solid #cbd5e1;
    }
    .side-header {
      background-color: #f8fafc;
      font-weight: bold;
      padding: 6px 12px;
      border-bottom: 1px solid #cbd5e1;
      font-size: 10.5px;
      color: #475569;
      text-transform: uppercase;
    }
    .ledger-table {
      width: 100%;
      border-collapse: collapse;
    }
    .ledger-table td {
      padding: 6px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    .ledger-table tr:last-child td {
      border-bottom: none;
    }
    .text-right {
      text-align: right;
    }
    .font-bold {
      font-weight: bold;
    }
    .amount-col {
      width: 30%;
      font-weight: 600;
      text-align: right;
    }
    .item-row {
      font-size: 11px;
    }
    .item-row.indent {
      padding-left: 20px;
      color: #475569;
    }
    .total-row {
      border-top: 1.5px double #111827 !important;
      border-bottom: 1.5px double #111827 !important;
      font-weight: bold;
      background-color: #fafafa;
    }
    .total-row td {
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="report-badge">
      <h2 class="badge-title">BALANCE SHEET</h2>
      <div id="badge-period" class="badge-period"></div>
    </div>
    <h1 id="company-title" class="company-title"></h1>
    <div id="company-details" class="company-details"></div>
    <div class="clear"></div>
  </div>

  <div class="ledger-container">
    <!-- Sources of Funds (Liabilities & Equity) -->
    <div class="ledger-side">
      <div class="side-header">Sources of Funds (Capital & Liabilities)</div>
      <table class="ledger-table">
        <tbody id="sources-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
    <!-- Application of Funds (Assets) -->
    <div class="ledger-side">
      <div class="side-header">Application of Funds (Assets)</div>
      <table class="ledger-table">
        <tbody id="application-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const rawData = '{{ bs_data_json | safe }}';
    const reportData = JSON.parse(rawData);

    // Set company details
    document.getElementById('company-title').textContent = reportData.companyInfo.name;
    let detailsHTML = '';
    if (reportData.companyInfo.address) detailsHTML += `Address: ${reportData.companyInfo.address}<br>`;
    if (reportData.companyInfo.contact) detailsHTML += `Phone: ${reportData.companyInfo.contact} | `;
    if (reportData.companyInfo.email) detailsHTML += `Email: ${reportData.companyInfo.email}`;
    document.getElementById('company-details').innerHTML = detailsHTML;

    // Set date
    document.getElementById('badge-period').textContent = `As of: ${reportData.period.endDate}`;

    function fmt(val) {
      if (val === undefined || val === null || isNaN(val)) return '₹0.00';
      return '₹' + Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 1. Sources of Funds Side
    const srcBody = document.getElementById('sources-body');
    const sf = reportData.sourcesOfFunds;

    // Capital Account
    if (sf.capitalAccount.total > 0 || sf.capitalAccount.items.length > 0) {
      srcBody.innerHTML += `<tr class="font-bold"><td>Capital Account</td><td class="amount-col">${fmt(sf.capitalAccount.total)}</td></tr>`;
      sf.capitalAccount.items.forEach(item => {
        srcBody.innerHTML += `<tr class="item-row"><td class="indent" style="padding-left: 20px; color: #475569;">${item.name}</td><td class="amount-col text-muted">${fmt(item.amount)}</td></tr>`;
      });
    }

    // Loans Liability
    if (sf.loansLiability.total > 0 || sf.loansLiability.items.length > 0) {
      srcBody.innerHTML += `<tr class="font-bold"><td>Loans (Liability)</td><td class="amount-col">${fmt(sf.loansLiability.total)}</td></tr>`;
      sf.loansLiability.items.forEach(item => {
        srcBody.innerHTML += `<tr class="item-row"><td class="indent" style="padding-left: 20px; color: #475569;">${item.name}</td><td class="amount-col text-muted">${fmt(item.amount)}</td></tr>`;
      });
    }

    // Current Liabilities
    if (sf.currentLiabilities.total > 0 || sf.currentLiabilities.items.length > 0) {
      srcBody.innerHTML += `<tr class="font-bold"><td>Current Liabilities</td><td class="amount-col">${fmt(sf.currentLiabilities.total)}</td></tr>`;
      sf.currentLiabilities.items.forEach(item => {
        srcBody.innerHTML += `<tr class="item-row"><td class="indent" style="padding-left: 20px; color: #475569;">${item.name}</td><td class="amount-col text-muted">${fmt(item.amount)}</td></tr>`;
      });
    }

    // Profit & Loss Account
    if (sf.profitLossAc.total !== 0 || sf.profitLossAc.items.length > 0) {
      srcBody.innerHTML += `<tr class="font-bold"><td>Profit & Loss A/c</td><td class="amount-col">${fmt(sf.profitLossAc.total)}</td></tr>`;
      sf.profitLossAc.items.forEach(item => {
        srcBody.innerHTML += `<tr class="item-row"><td class="indent" style="padding-left: 20px; color: #475569;">${item.name}</td><td class="amount-col text-muted">${fmt(item.amount)}</td></tr>`;
      });
    }

    // 2. Application of Funds Side
    const appBody = document.getElementById('application-body');
    const af = reportData.applicationOfFunds;

    // Fixed Assets
    if (af.fixedAssets.total > 0 || af.fixedAssets.items.length > 0) {
      appBody.innerHTML += `<tr class="font-bold"><td>Fixed Assets</td><td class="amount-col">${fmt(af.fixedAssets.total)}</td></tr>`;
      af.fixedAssets.items.forEach(item => {
        appBody.innerHTML += `<tr class="item-row"><td class="indent" style="padding-left: 20px; color: #475569;">${item.name}</td><td class="amount-col text-muted">${fmt(item.amount)}</td></tr>`;
      });
    }

    // Current Assets
    if (af.currentAssets.total > 0 || af.currentAssets.items.length > 0) {
      appBody.innerHTML += `<tr class="font-bold"><td>Current Assets</td><td class="amount-col">${fmt(af.currentAssets.total)}</td></tr>`;
      af.currentAssets.items.forEach(item => {
        appBody.innerHTML += `<tr class="item-row"><td class="indent" style="padding-left: 20px; color: #475569;">${item.name}</td><td class="amount-col text-muted">${fmt(item.amount)}</td></tr>`;
      });
    }

    // Pad sides so they align
    const srcRows = srcBody.rows.length;
    const appRows = appBody.rows.length;
    const diff = Math.abs(srcRows - appRows);
    const target = diff > 0 ? (srcRows < appRows ? srcBody : appBody) : null;
    if (target) {
      for (let i = 0; i < diff; i++) {
        target.innerHTML += `<tr><td>&nbsp;</td><td>&nbsp;</td></tr>`;
      }
    }

    // Add Totals
    srcBody.innerHTML += `<tr class="total-row"><td>TOTAL</td><td class="amount-col">${fmt(sf.total)}</td></tr>`;
    appBody.innerHTML += `<tr class="total-row"><td>TOTAL</td><td class="amount-col">${fmt(af.total)}</td></tr>`;
  </script>
</body>
</html>
