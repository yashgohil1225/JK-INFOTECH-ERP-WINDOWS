<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sales by Customer Report</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 15mm 10mm;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1e293b;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .header {
      margin-bottom: 25px;
      border-bottom: 2px solid #111827;
      padding-bottom: 15px;
    }
    .company-title {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 5px 0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .company-details {
      color: #374151;
      font-size: 11px;
      line-height: 1.4;
    }
    .report-badge {
      float: right;
      text-align: right;
    }
    .badge-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 5px 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-period {
      font-size: 10px;
      font-weight: bold;
      color: #374151;
      text-transform: uppercase;
    }
    .clear {
      clear: both;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .report-table th {
      background-color: #f3f4f6;
      color: #111827;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 10px 12px;
      border-bottom: 2px solid #d1d5db;
      text-align: left;
    }
    .report-table td {
      padding: 10px 12px;
      font-size: 11px;
      border-bottom: 1px solid #e5e7eb;
    }
    .text-right {
      text-align: right;
    }
    .text-center {
      text-align: center;
    }
    .grand-total {
      background-color: #111827;
      color: white;
      font-weight: bold;
    }
    .grand-total td {
      border-bottom: none;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="report-badge">
      <h2 class="badge-title">Sales by Customer</h2>
      <div id="badge-period" class="badge-period"></div>
    </div>
    <h1 id="company-title" class="company-title"></h1>
    <div id="company-details" class="company-details"></div>
    <div class="clear"></div>
  </div>

  <table class="report-table">
    <thead>
      <tr>
        <th style="width: 35%;">Customer Details</th>
        <th style="width: 20%;">GSTIN</th>
        <th class="text-center" style="width: 10%;">Invoices</th>
        <th class="text-right" style="width: 15%;">Taxable Amt</th>
        <th class="text-right" style="width: 15%;">Tax Value</th>
        <th class="text-right" style="width: 15%;">Total Sales</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Data injected dynamically -->
    </tbody>
  </table>

  <script>
    const rawData = '{{ report_data_json | safe }}';
    const reportData = JSON.parse(rawData);

    document.getElementById('company-title').textContent = reportData.companyInfo.name;
    let detailsHTML = '';
    if (reportData.companyInfo.address) detailsHTML += `Address: ${reportData.companyInfo.address}<br>`;
    const gstStr = reportData.companyInfo.gst_number ? `GSTIN: ${reportData.companyInfo.gst_number}` : '';
    const panStr = reportData.companyInfo.pan_number ? `PAN: ${reportData.companyInfo.pan_number}` : (reportData.companyInfo.gst_number && reportData.companyInfo.gst_number.length >= 12 ? `PAN: ${reportData.companyInfo.gst_number.substring(2, 12)}` : '');
    const gstPanCombined = [gstStr, panStr].filter(Boolean).join(' | ');
    if (gstPanCombined) detailsHTML += `${gstPanCombined}<br>`;
    if (reportData.companyInfo.contact) detailsHTML += `Phone: ${reportData.companyInfo.contact} | `;
    if (reportData.companyInfo.email) detailsHTML += `Email: ${reportData.companyInfo.email}`;
    document.getElementById('company-details').innerHTML = detailsHTML;

    document.getElementById('badge-period').textContent = `Period: ${reportData.startDate} to ${reportData.endDate}`;

    const tbody = document.getElementById('table-body');
    let totalSales = 0;
    let totalTax = 0;
    let totalInvoices = 0;

    function fmt(val) {
      return '₹' + Number(val || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    if (reportData.sales && reportData.sales.length > 0) {
      reportData.sales.forEach(r => {
        totalSales += r.total_sales;
        totalTax += r.tax_amount;
        totalInvoices += r.invoice_count;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <strong>${r.customer_name}</strong><br>
            <span style="font-size: 9px; color: #64748b; font-weight: bold; letter-spacing: 0.5px;">Mob: ${r.mobile || 'N/A'}</span>
          </td>
          <td style="font-family: monospace; font-weight: bold; color: #4b5563;">${r.gstin || 'Unregistered'}</td>
          <td class="text-center" style="font-weight: bold;">${r.invoice_count}</td>
          <td class="text-right">₹${Number(r.subtotal).toFixed(2)}</td>
          <td class="text-right">₹${Number(r.tax_amount).toFixed(2)}</td>
          <td class="text-right" style="font-weight: bold;">${fmt(r.total_sales)}</td>
        `;
        tbody.appendChild(tr);
      });

      const totalTr = document.createElement('tr');
      totalTr.className = 'grand-total';
      totalTr.innerHTML = `
        <td colspan="2" style="text-transform: uppercase; letter-spacing: 1px; font-weight: 800; padding: 12px;">Total Summary</td>
        <td class="text-center" style="font-weight: 900; padding: 12px;">${totalInvoices}</td>
        <td class="text-right" style="font-weight: 900; padding: 12px;">${fmt(totalSales - totalTax)}</td>
        <td class="text-right" style="font-weight: 900; padding: 12px;">${fmt(totalTax)}</td>
        <td class="text-right" style="font-weight: 900; padding: 12px;">${fmt(totalSales)}</td>
      `;
      tbody.appendChild(totalTr);
    } else {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">No customer sales data recorded in the selected period.</td></tr>`;
    }
  </script>
</body>
</html>
