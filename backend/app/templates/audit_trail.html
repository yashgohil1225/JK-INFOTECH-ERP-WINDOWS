<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>System Audit Trail Report</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 15mm 10mm;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1e293b;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .header {
      margin-bottom: 25px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 15px;
    }
    .company-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f2537;
      margin: 0 0 5px 0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .company-details {
      color: #64748b;
      font-size: 11px;
      line-height: 1.4;
    }
    .report-badge {
      float: right;
      text-align: right;
    }
    .badge-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 5px 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-period {
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      text-transform: uppercase;
    }
    .clear {
      clear: both;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .report-table th {
      background-color: #f8fafc;
      color: #334155;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 10px 12px;
      border-bottom: 2px solid #e2e8f0;
      text-align: left;
    }
    .report-table td {
      padding: 10px 12px;
      font-size: 11px;
      border-bottom: 1px solid #e2e8f0;
    }
    .text-right {
      text-align: right;
    }
    .text-center {
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-create {
      background-color: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .badge-update {
      background-color: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .badge-delete {
      background-color: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .badge-other {
      background-color: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="report-badge">
      <h2 class="badge-title">System Audit Trail</h2>
      <div id="badge-period" class="badge-period"></div>
    </div>
    <h1 id="company-title" class="company-title"></h1>
    <div id="company-details" class="company-details"></div>
    <div class="clear"></div>
  </div>

  <table class="report-table">
    <thead>
      <tr>
        <th style="width: 25%;">Timestamp</th>
        <th style="width: 20%;">User</th>
        <th style="width: 15%;">Action</th>
        <th style="width: 20%;">Module</th>
        <th style="width: 20%;">Record ID</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Data injected dynamically -->
    </tbody>
  </table>

  <script>
    const rawData = '{{ report_data_json | safe }}';
    const reportData = JSON.parse(rawData);

    document.getElementById('company-title').textContent = reportData.companyInfo.name;
    let detailsHTML = '';
    if (reportData.companyInfo.address) detailsHTML += `Address: ${reportData.companyInfo.address}<br>`;
    if (reportData.companyInfo.gst_number) detailsHTML += `GSTIN: ${reportData.companyInfo.gst_number} | `;
    if (reportData.companyInfo.contact) detailsHTML += `Phone: ${reportData.companyInfo.contact} | `;
    if (reportData.companyInfo.email) detailsHTML += `Email: ${reportData.companyInfo.email}`;
    document.getElementById('company-details').innerHTML = detailsHTML;

    document.getElementById('badge-period').textContent = `Generated: ${reportData.generatedAt}`;

    const tbody = document.getElementById('table-body');

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const day = String(date.getDate()).padStart(2, '0');
      const month = date.toLocaleString('en-IN', { month: 'short' });
      const year = date.getFullYear();
      const time = date.toTimeString().split(' ')[0];
      return `${day}-${month}-${year} ${time}`;
    }

    if (reportData.logs && reportData.logs.length > 0) {
      reportData.logs.forEach(log => {
        const tr = document.createElement('tr');
        
        let actionClass = 'badge-other';
        if (log.action === 'CREATE') actionClass = 'badge-create';
        else if (log.action === 'UPDATE') actionClass = 'badge-update';
        else if (log.action === 'DELETE') actionClass = 'badge-delete';

        tr.innerHTML = `
          <td>${formatDate(log.created_at)}</td>
          <td><strong>${log.user_name || 'System'}</strong></td>
          <td><span class="badge ${actionClass}">${log.action}</span></td>
          <td style="font-weight: bold; color: #111827; text-transform: uppercase; font-size: 10px;">${log.module}</td>
          <td style="font-family: monospace; font-size: 10px; color: #64748b;">${log.record_id || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: #64748b;">No system logs recorded.</td></tr>`;
    }
  </script>
</body>
</html>
