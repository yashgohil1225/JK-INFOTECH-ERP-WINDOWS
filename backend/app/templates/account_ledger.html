<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Account Ledger Report</title>
  <style>
    @page {
      size: A4 {% if landscape %}landscape{% else %}portrait{% endif %};
      margin: 8mm 6mm;
    }
    html, body {
      width: 100% !important;
      max-width: 100% !important;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      color: #1e293b;
      background-color: #fff;
      margin: 0;
      padding: 0;
      box-sizing: border-box !important;
    }
    table {
      width: 100% !important;
      max-width: 100% !important;
      border-collapse: collapse;
    }
    th, td {
      word-wrap: break-word !important;
      word-break: break-word !important;
      white-space: normal !important;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid #111827;
      padding-bottom: 12px;
    }
    .company-title {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }
    .company-details {
      color: #475569;
      font-size: 11px;
      line-height: 1.4;
    }
    .report-badge {
      float: right;
      text-align: right;
    }
    .badge-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }
    .badge-period {
      font-size: 10px;
      font-weight: bold;
      color: #475569;
    }
    .clear {
      clear: both;
    }
    .meta-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta-title {
      font-size: 14px;
      font-weight: 800;
      color: #111827;
    }
    .meta-balances {
      text-align: right;
      font-size: 11.5px;
      color: #475569;
    }
    .table-container {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background-color: #f8fafc;
      font-weight: bold;
      padding: 8px 12px;
      border-bottom: 1px solid #cbd5e1;
      font-size: 10.5px;
      color: #475569;
      text-transform: uppercase;
      text-align: left;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .text-right {
      text-align: right;
    }
    .font-bold {
      font-weight: bold;
    }
    .debit-val {
      color: #111827;
      font-weight: 600;
    }
    .credit-val {
      color: #111827;
      font-weight: 600;
    }
    .bal-val {
      font-weight: 700;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="report-badge">
      <h2 class="badge-title">ACCOUNT LEDGER</h2>
      <div id="badge-period" class="badge-period"></div>
    </div>
    <h1 id="company-title" class="company-title"></h1>
    <div id="company-details" class="company-details"></div>
    <div class="clear"></div>
  </div>

  <div class="meta-box">
    <div>
      <div class="meta-title" id="account-name"></div>
      <div id="period-range" style="font-size: 11px; color: #64748b; margin-top: 2px;"></div>
    </div>
    <div class="meta-balances">
      Opening Bal: <span id="opening-bal" class="font-bold" style="color: #111827; margin-right: 15px;">₹0.00</span>
      Closing Bal: <span id="closing-bal" class="font-bold" style="color: #111827;">₹0.00</span>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 12%;">Date</th>
          <th style="width: 15%;">Reference</th>
          <th style="width: 38%;">Description / Particulars</th>
          <th class="text-right" style="width: 11%;">Debit (Dr)</th>
          <th class="text-right" style="width: 11%;">Credit (Cr)</th>
          <th class="text-right" style="width: 13%;">Balance</th>
        </tr>
      </thead>
      <tbody id="ledger-body">
        <!-- Dynamically rendered via JS -->
      </tbody>
    </table>
  </div>

  <script>
    const rawData = '{{ db_data_json | safe }}';
    const reportData = JSON.parse(rawData);

    // Set company details
    document.getElementById('company-title').textContent = reportData.company.name;
    let detailsHTML = '';
    if (reportData.company.address) detailsHTML += `Address: ${reportData.company.address}<br>`;
    const gstStr = reportData.company.gst_number ? `GSTIN: ${reportData.company.gst_number}` : '';
    const panStr = reportData.company.pan_number ? `PAN: ${reportData.company.pan_number}` : (reportData.company.gst_number && reportData.company.gst_number.length >= 12 ? `PAN: ${reportData.company.gst_number.substring(2, 12)}` : '');
    const gstPanCombined = [gstStr, panStr].filter(Boolean).join(' | ');
    if (gstPanCombined) detailsHTML += `${gstPanCombined}<br>`;
    document.getElementById('company-details').innerHTML = detailsHTML;

    // Set account name
    document.getElementById('account-name').textContent = reportData.account_name;
    
    // Set dates
    const startStr = reportData.period.start;
    const endStr = reportData.period.end;
    document.getElementById('badge-period').textContent = `Period: ${startStr} to ${endStr}`;
    document.getElementById('period-range').textContent = `Ledger Statement from ${startStr} to ${endStr}`;

    function fmt(val) {
      if (val === undefined || val === null || isNaN(val)) return '₹0.00';
      return '₹' + Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      if (typeof dateStr === 'string' && dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
        const parts = dateStr.split('-');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      const date = new Date(dateStr);
      return isNaN(date.getTime()) ? String(dateStr) : date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    // Set balances
    document.getElementById('opening-bal').textContent = fmt(reportData.opening_balance);
    document.getElementById('closing-bal').textContent = fmt(reportData.closing_balance);

    const tbody = document.getElementById('ledger-body');

    // Add opening row
    tbody.innerHTML += `
      <tr style="background-color: #fafafa; font-style: italic;">
        <td>${startStr}</td>
        <td>-</td>
        <td class="font-semibold text-slate-500">Opening Balance Brought Forward</td>
        <td></td>
        <td></td>
        <td class="text-right font-bold bal-val">${fmt(reportData.opening_balance)}</td>
      </tr>
    `;

    let totalDebit = 0;
    let totalCredit = 0;

    if (reportData.transactions && reportData.transactions.length > 0) {
      reportData.transactions.forEach(tx => {
        const dr = Number(tx.debit || 0);
        const cr = Number(tx.credit || 0);
        totalDebit += dr;
        totalCredit += cr;

        tbody.innerHTML += `
          <tr>
            <td>${formatDate(tx.date)}</td>
            <td class="font-semibold text-slate-800">${tx.ref || '-'}</td>
            <td>${tx.description || 'Transaction entry'}</td>
            <td class="text-right debit-val">${dr > 0 ? fmt(dr) : ''}</td>
            <td class="text-right credit-val">${cr > 0 ? fmt(cr) : ''}</td>
            <td class="text-right font-bold bal-val">${fmt(tx.balance)}</td>
          </tr>
        `;
      });
    } else {
      tbody.innerHTML += `
        <tr>
          <td colspan="6" class="text-center text-slate-400 py-10">No transactions recorded in the selected period.</td>
        </tr>
      `;
    }

    // Add totals row
    tbody.innerHTML += `
      <tr style="background-color: #f8fafc; font-weight: bold; border-top: 1.5px solid #cbd5e1;">
        <td colspan="3" class="text-right">TOTAL PERIOD MOVEMENTS:</td>
        <td class="text-right debit-val">${fmt(totalDebit)}</td>
        <td class="text-right credit-val">${fmt(totalCredit)}</td>
        <td class="text-right font-bold bal-val">${fmt(reportData.closing_balance)}</td>
      </tr>
    `;
  </script>
</body>
</html>
